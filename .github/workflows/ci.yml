name: Validate ScholarRoute

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, checked 2026-10-20
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, checked 2026-10-20
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check package and source mappings
        run: python tools/validate_package.py
      - name: Check README registry tables
        run: python tools/update_readme.py --check
      - name: Check coverage and repair index
        run: python tools/coverage_audit.py --check
      - name: Run offline regression suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work/validation
          python tests/run.py 2>&1 | tee work/validation/tests.txt
      - name: Run synthetic end-to-end demo
        run: |
          python examples/run_demo.py --project ./work/ci-demo
          python skills/scholar-route/scripts/scholar_route.py validate --project ./work/ci-demo
      - name: Package exact tested source
        if: always()
        run: |
          mkdir -p work/validation
          git archive --format=zip --output=work/validation/scholar-route-source.zip HEAD
          git rev-parse HEAD > work/validation/commit.txt
      - name: Preserve source and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, checked 2026-10-20
        with:
          name: scholar-route-python-${{ matrix.python-version }}
          path: work/validation/
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Publish tested version when its release is new
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import ast; from pathlib import Path; t=ast.parse(Path("skills/scholar-route/scripts/scholar_route.py").read_text()); print(next(ast.literal_eval(n.value) for n in t.body if isinstance(n,ast.Assign) and any(isinstance(x,ast.Name) and x.id=="VERSION" for x in n.targets)))')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; keeping it unchanged."
            exit 0
          fi
          git archive --format=zip --prefix="scholar-route-$tag/" --output="scholar-route-$tag.zip" HEAD
          gh release create "$tag" "scholar-route-$tag.zip" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ScholarRoute $tag" --notes-file RELEASE_NOTES.md
